<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="100%" stop-color="#04060b" />
    </linearGradient>

    <!-- Neon Squircle Border Gradient -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>

    <!-- Chat Bubble Gradient -->
    <linearGradient id="bubbleGrad" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#00C0FF" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#C026D3" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Squircle Badge -->
  <rect x="6" y="6" width="116" height="116" rx="30" ry="30" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="116" height="116" rx="30" ry="30" fill="none" stroke="url(#neonBorder)" stroke-width="2.5" filter="url(#neonGlow)" opacity="0.9" />

  <!-- Chat Bubble with Integrated Tail -->
  <g transform="translate(64, 60)">
    <!-- Bubble Body + Tail -->
    <path d="M 0 -33 
             C 18.2 -33 33 -18.2 33 0 
             C 33 8.5 29.8 16.3 24.5 22.1 
             L 28 35.5 
             L 15.5 30 
             C 11 32 6 33 0 33 
             C -18.2 33 -33 18.2 -33 0 
             C -33 -18.2 -18.2 -33 0 -33 Z"
          fill="url(#bubbleGrad)" />

    <!-- Lightning Bolt Cutout with Dark Core and Glow -->
    <path d="M 5 -27 
             L -15 3 
             L -3 3 
             L -14 31 
             L 17 -3 
             L 3 -3 
             Z" 
          fill="#060913" 
          stroke="url(#neonBorder)" 
          stroke-width="1.8" 
          stroke-linejoin="round" />
  </g>
</svg>
